spring:
  application:
    name: taskmanagement

  # DB の接続情報。値は、リポジトリ直下の docker-compose.yml と合わせている。
  datasource:
    url: jdbc:postgresql://localhost:5432/taskmanagement
    username: postgres
    password: postgres

  # data.sql を、DB の種類に関係なく起動時に毎回実行する
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      # update: 起動時に、Entity に合わせてテーブルを自動で作る・足りない列を追加する(学習・開発用)。
      ddl-auto: update
    # 実行された SQL をログに出す(テーブルが作られる様子を確認するため)
    show-sql: true
    open-in-view: false
    # Hibernate がテーブルを作ったあとで data.sql を実行する(順番の指定)
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
